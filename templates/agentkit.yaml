# agentkit project config. Every project-specific value lives here (and in devResources/).
project_name: ""

paths:
  dev_resources: devResources/                          # dev and reviewer load EVERY file in here
  primary_design_doc: devResources/<doc>.md             # the doc stories are planned from
  knowledge_log: devResources/agent-knowledge.md
  scrum: scrum/
  backlog: backlog/
  completed: ""                                         # optional: move completed stories here (e.g. scrum/completed/);
                                                        # into sprint-<n>/ when BOARD.md has current_sprint: <n>

commands:            # run from the project root; leave "" if the project has none yet
  install: ""
  build: ""
  lint: ""
  typecheck: ""
  test: ""           # the FULL suite; dev and reviewer both require it green
  test_ports: []     # ports the test commands' servers listen on, e.g. [4173, 3900]: leftovers from a killed run
                     # (this repo's processes only) are stopped before each loop session and each test run

workflow:
  max_fix_attempts: 3          # fix stories .1, .2, .3, then backlog
  pause_after_planning: true   # approve the story list before any dev starts
  git_commit_per_story: true   # dev commits "STR-001: <title>" when done
  max_files_per_story: 8       # scrum master splits stories that touch more files than this
  playbook: ""                 # optional project file (e.g. scripts/agentkit/PLAYBOOK.md) that adds to /agentkit:run

models:                        # the Agent tool's model override per subagent; "inherit" = the main session's model
  dev: sonnet
  reviewer: sonnet
  visual_qa: sonnet
  scrum_master: sonnet
  orchestrator: sonnet         # each fresh headless session started by /agentkit:loop (scripts/run-loop.sh)
  escalate_dev_to: opus        # model for dev once a story has failed review this many times ("" = never)
  escalate_after_failed_reviews: 2

visual_qa:                     # optional: agent-visual-qa checks UI stories in real Chrome before review
  enabled: false               # needs the chrome-devtools-mcp plugin (see README "Visual QA")
  ui_paths: []                 # globs; a story whose diff touches any of these gets visual QA, e.g. ["apps/web/**"]
  base_url: ""                 # where the app is served, e.g. http://localhost:5173
  start_command: ""            # how to start the app if base_url is not answering, e.g. "pnpm dev"
  viewports:                   # every check runs at each of these
    - { name: iphone, width: 390, height: 844, mobile: true, dpr: 3 }
    - { name: android, width: 412, height: 915, mobile: true, dpr: 2.625 }
    - { name: laptop, width: 1280, height: 800, mobile: false, dpr: 1 }
    - { name: desktop, width: 1440, height: 900, mobile: false, dpr: 1 }
  design_refs: []              # files that show what "correct" looks like, e.g. [devResources/prototype.html]
  max_rework: 2                # dev → visual QA rework loops before the story goes to review anyway
